<!doctype html>
<!-- `lang` and `dir` are both replaced at runtime from the active locale
     (src/i18n/context.tsx). These are the pre-hydration defaults. -->
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <!-- Brand paper. Paints the Android status bar / iOS Safari chrome before
         the app boots, so first frame is warm rather than white. -->
    <meta name="theme-color" content="#fbf8f2" />
    <title>Allr</title>
  </head>
  <body>
    <!-- `scrollbar-dt` themes the NATIVE scrollbar app-wide (see styles.css),
         exactly as apps/desktop/index.html does. -->
    <div id="root" class="scrollbar-dt"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
