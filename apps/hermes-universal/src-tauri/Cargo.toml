[package]
name = "hermes-universal"
version = "0.0.1"
description = "Hermes Universal — Tauri v2 client (desktop + Android + iOS from one codebase)."
authors = ["Nous Research <info@nousresearch.com>"]
edition = "2021"
# 1.85 is russh 0.62's MSRV (see the `russh` dependency below). Everything else
# in the tree builds on 1.77; this is the floor the SSH gateway mode forces.
rust-version = "1.85"

# The library target is what the Android/iOS project links against, so the
# cdylib/staticlib crate-types are mandatory for the mobile targets. The name
# must match what src/main.rs (desktop) and the generated mobile entry call.
[lib]
name = "hermes_universal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Update checks (MJX-6, updates.rs): the real GitHub-Releases / Play-listing /
# iTunes-Lookup queries are OFF by default — a stock build compiles the stub,
# which reports "no update available" and never touches the network. Turn them on
# for a release build with `--features update-checks`.
#
# Tracing (MJXHRM-176 follow-on): OpenTelemetry spans for the backend, exported
# to a local collector. OFF by default — a stock build compiles none of it and
# links no exporter.
#
# TWO switches, deliberately. The feature only makes tracing POSSIBLE; nothing
# is recorded until `HERMES_TRACE=1` is set at launch. So an ordinary
# `tauri dev --features tracing` still costs nothing, and a release binary
# contains nothing at all.
#
# `tauri/tracing` is the load-bearing entry. Tauri's own command macro wraps
# every #[tauri::command] in a span and — critically — `.instrument()`s the
# SPAWNED future for async ones (tauri-macros `command/wrapper.rs`). That is the
# part a hand-rolled `invoke_handler` wrapper cannot do: `respond_async` spawns
# and returns, so a wrapper would time dispatch (microseconds) rather than the
# work. "Trace every command" therefore costs one word here, not 50 edits.
[features]
default = []
update-checks = ["dep:regex"]
tracing = [
  "dep:tracing",
  "dep:tracing-subscriber",
  "dep:tracing-log",
  "dep:tracing-opentelemetry",
  "dep:opentelemetry",
  "dep:opentelemetry_sdk",
  "dep:opentelemetry-otlp",
  "tauri/tracing"
]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Structured logging — on Android these route to logcat via the `android_logger`
# init that tao/wry performs on startup, so `log::` calls are visible with
# `adb logcat`. Used for connect/OAuth diagnostics on mobile.
log = "0.4"

# Platform detection (A5): lets the frontend tell Android from a desktop Tauri
# build so it can gate mobile-only behaviour (e.g. hide Local gateway mode).
tauri-plugin-os = "2"

# Secure credential storage (D1): real OS-native keystore via keyring-core 1.0 —
# Android SharedPreferences encrypted by the Android Keystore, iOS/macOS Keychain,
# Windows Credential Manager, Linux Secret Service. Silent (no biometric prompt).
# VENDORED under plugins/ (from charlesportwoodii/tauri-plugin-keyring) to drop its
# unused specta scaffold deps, which don't build on stable Rust — see that crate's
# Cargo.toml. FIXME(D1): switch to a crates.io release once one exists.
tauri-plugin-keyring = { path = "plugins/tauri-plugin-keyring" }

# Microphone OS-permission (R10, voice). In-tree plugin: durably declares Android
# RECORD_AUDIO/MODIFY_AUDIO_SETTINGS (merged from a committed manifest, since gen/
# is gitignored) + a check/request seam for Android/iOS. Capture itself stays in
# the webview (getUserMedia); desktop is a no-op. See plugins/tauri-plugin-mic.
tauri-plugin-mic = { path = "plugins/tauri-plugin-mic" }

# Open external links in the system browser (Gc6/R11).
tauri-plugin-opener = "2"

# Haptic feedback on send/approval (Gc10/R9).
tauri-plugin-haptics = "2"

# File attachments (Gc8/R7): native picker + read the picked file to a data-URL.
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

# Native OS notifications (Ic10/R8): turn-done / approval / error while backgrounded.
tauri-plugin-notification = "2"

# Transport core (Step 2a): all HTTP + WS traffic runs here, not in the webview,
# so there is no CORS constraint and we can talk to any backend on the LAN.
# `net` is for the SSH gateway's local port-forward listener (ssh/forward.rs):
# we bind 127.0.0.1:0 ourselves and keep the listener, rather than the
# bind-then-release-then-hope dance the Electron desktop needed.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "process", "io-util", "time", "net"] }
# Random session token for the local-spawn backend (E3.a, desktop-only).
# NOTE: russh pulls getrandom 0.4; the two majors coexist deliberately. Do not
# "dedupe" them — 0.4 changed its API and 0.2 is what this crate's code targets.
getrandom = "0.2"

# --- SSH gateway transport (MJX-55) -------------------------------------------
# A pure-Rust SSH client, NOT a shell-out to the system `ssh` binary the way the
# Electron desktop app does it. That is deliberate: it makes SSH gateway mode work
# on Android/iOS, which have no ssh binary. The cost is that ~/.ssh/config parsing,
# known_hosts TOFU, ssh-agent and ProxyJump are ours to implement (see src/ssh/).
#
# default-features would pull `aws-lc-rs`, which needs cmake + a C toolchain and
# breaks the Android NDK cross-build. russh supports `ring` as an alternative
# crypto backend — the same choice already made for rustls below.
russh = { version = "0.62", default-features = false, features = ["ring", "rsa", "flate2"] }
# Control-socket-free ownership identity: sha256(installationId, scope) — see
# ssh/ownership.rs, ported from desktop's electron/desktop-installation.ts.
sha2 = "0.10"
hex = "0.4"
# CancellationToken for the bootstrap coordinator's supersede / drain barrier
# (ssh/coordinator.rs, ported from electron/ssh-bootstrap-coordinator.ts).
tokio-util = "0.7"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
# Already in the tree transitively (url / reqwest), so naming it directly costs
# no extra compilation unit. Used by the hermes-media:// scheme to decode a path
# for its extension check without hand-rolling a decoder.
percent-encoding = "2"
# rustls so we don't need OpenSSL/NDK-cross OpenSSL on the Android build.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "cookies"] }
# Enable BOTH root sources: native-roots so desktop honors the OS trust store (corporate
# / self-signed CAs), AND webpki-roots as the fallback. Android exposes no file-based
# native cert store, so native-roots alone fails at the wss:// handshake with "no native
# root CA certificates found"; with webpki-roots also enabled tokio-tungstenite suppresses
# that error and uses the bundled Mozilla roots (the same set reqwest's `rustls-tls` uses).
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots", "rustls-tls-webpki-roots"] }
# Pin the rustls crypto provider explicitly (see lib.rs): tokio-tungstenite's
# wss:// path calls ClientConfig::builder(), which needs a process-default provider.
rustls = { version = "0.23", default-features = false, features = ["ring"] }

# VS Code Marketplace theme install (marketplace.rs): a `.vsix` is a plain zip, so
# we unzip the extension and pull its color-theme JSON out. deflate-only (pure-Rust
# flate2/miniz_oxide backend) — no native codec deps, so it stays cross-platform
# incl. the Android/iOS NDK build.
zip = { version = "2", default-features = false, features = ["deflate"] }

# Play Store listing scrape (updates.rs) — only pulled in by `update-checks`.
# Google publishes no version API, so the listing HTML is the only source; the
# patterns it matches are inherently unstable, hence the soft "unparsed" result.
regex = { version = "1", optional = true }

# OpenTelemetry span export (`tracing` feature). All optional — a default build
# links none of them.
#
# EVERY ONE IS `default-features = false`, and that is not tidiness. This crate
# installs exactly ONE rustls crypto provider process-wide (see the
# `install_default` call in lib.rs) and panics if the features ever expose more
# than one; russh is pinned to `ring` for the same reason, because `aws-lc-rs`
# also breaks the Android NDK cross-build. `opentelemetry-otlp` with default
# features pulls tonic's TLS stack, which can drag in a SECOND provider — and the
# symptom would be a panic at the first wss:// handshake, on every platform, far
# from anything that looks telemetry-related.
#
# The collector is plaintext on loopback, so the exporter needs no TLS at all.
# `cargo tree -d` must show one rustls provider before this is changed.
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "registry"], optional = true }
# Bridges the existing `log::` calls into the same pipeline. Desktop currently
# installs no logger at all, so those calls go nowhere today — this is the first
# time they become visible outside Android's logcat.
tracing-log = { version = "0.2", default-features = false, features = ["log-tracer", "std"], optional = true }
tracing-opentelemetry = { version = "0.31", default-features = false, optional = true }
opentelemetry = { version = "0.30", default-features = false, features = ["trace"], optional = true }
opentelemetry_sdk = { version = "0.30", default-features = false, features = ["trace"], optional = true }
opentelemetry-otlp = { version = "0.30", default-features = false, features = ["trace", "grpc-tonic"], optional = true }

# Explicit, serializable cookie jar (D3.a/D4): replaces reqwest's private default
# jar so the OAuth flow (oauth.rs) can share one store across a redirect-following
# and a redirect-disabled client, and so session cookies can be serialized to the
# keyring and rehydrated across launches (R2b).
reqwest_cookie_store = "0.8"
# Direct handle on the cookie store's JSON (de)serialization (D4/R2b) — reqwest_cookie_store
# re-exports the store type but not its serde helpers.
cookie_store = "0.21"

# --- Native voice capture + encode (voice/, MJX-96) ---------------------------
# Rust owns the whole voice audio lifecycle across ALL platforms now: cpal captures
# raw PCM (ALSA/Linux, CoreAudio/macOS+iOS, WASAPI/Windows, AAudio-oboe/Android), we
# resample to 16 kHz mono and encode with pure-Rust codecs (no system GStreamer/libav,
# no C toolchain beyond Android's oboe), then POST the transcription from Rust. These
# are unconditional (not desktop-gated) so the mobile targets get the same engine; the
# Android build additionally needs the NDK for cpal's oboe backend (see the
# `[target.'cfg(target_os = "android")']` override below).
cpal = "0.15"
# Pure-Rust anti-aliased sample-rate conversion → 16 kHz mono for whisper.
rubato = "0.16"
# Pure-Rust WAV encoder (default output; gateway maps audio/wav → .wav).
hound = "3.5"
# Pure-Rust FLAC encoder (optional compressed output; gateway maps audio/flac → .flac).
flacenc = "0.4"
# Encode the clip into the `data:` URL the transcribe endpoint wants — kept in Rust so
# the ~1 MB base64 clip never crosses IPC (Tauri serializes `Vec<u8>` as a JSON number
# array, ~4x bloat).
base64 = "0.22"

# Local shell PTY for the right-pane terminal (pty.rs, desktop-only). Cross-platform
# PTY: Unix openpty / Windows ConPTY. Gated OFF the mobile targets — a phone has no
# local shell, the right pane isn't shown there, and this keeps it out of the NDK build.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
portable-pty = "0.9"

# Route Rust `log::` output to logcat on Android. tao does not reliably install a
# logger, so our connect/OAuth diagnostics were invisible; init it ourselves in
# `run()`. Android-only — desktop uses stdout. cpal's Android backend (oboe) needs
# the NDK/oboe toolchain — see the cpal note under [dependencies].
[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
# cpal on Android speaks to AAudio/OpenSL ES via the C++ `oboe` library; the
# `oboe-shared-stdcxx` feature links libc++_shared from the NDK. Requires the NDK
# on the build host (the user drives Android builds — MJX-96).
cpal = { version = "0.15", features = ["oboe-shared-stdcxx"] }

# GTK (Linux only) — window translucency sets the GTK toplevel's opacity
# (appearance.rs). Version pinned to Tauri's gtk to avoid a duplicate in the tree.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
# WebKitGTK (Linux only) — the desktop webview auto-DENIES getUserMedia unless the
# embedder answers WebKitWebView's `permission-request` signal. wry doesn't, so we
# allow microphone requests ourselves (see lib.rs). Version matches wry's webkit2gtk
# (0.55 → 2.0.2) to avoid a duplicate in the tree; `v2_8` exposes the
# UserMediaPermissionRequest type used to scope the allow to mic/camera only.
webkit2gtk = { version = "2.0", features = ["v2_8"] }
