    ring was centred on (32,32) while the paper disc sat at (36,36), so the ring
    read as a crescent rather than a ring.

    Everything here is concentric on (33.593, 33.593), which is exactly where
    the real mark's petal bounding box, its disc and its viewBox all centre.
    No filters and no strokes, so it stays crisp at 16px.
