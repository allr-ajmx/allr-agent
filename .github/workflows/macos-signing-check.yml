# Prove the macOS signing AND notarization setup works, WITHOUT cutting a
# release.
#
# release-desktop.yml already verifies both, but it only fires on a
# `desktop-v*` tag push -- so without this the only way to find out whether the
# Apple secrets were right is to publish a real release and look. That gap is
# what let desktop-v0.0.7 ship a correctly signed but UNNOTARIZED bundle, which
# Gatekeeper refuses on every downloaded copy.
#
# This builds ONE architecture of the product app, runs the same shared
# verifier release-desktop.yml runs, and stops. No draft release, no tag, no
# publish, no updater manifest.
#
# The two failures this rules out are different, and conflating them is what
# sent the last diagnosis at the wrong fix:
#
#   ad-hoc signed   -> KEYCHAIN prompts. macOS binds a keychain item's ACL to
#                      the requesting code's designated requirement; an ad-hoc
#                      bundle has none, so nothing can be bound and "Always
#                      Allow" has nothing to stick to. The app keeps ONE
#                      keychain item and seals the rest into a file
#                      (apps/hermes-universal/src-tauri/src/secrets/), so an
#                      unsigned build cost one password dialog per launch
#                      rather than one per credential. Real through
#                      desktop-v0.0.3; fixed when the four signing secrets
#                      landed on 2026-08-22.
#
#   not notarized   -> GATEKEEPER refusal, and the admin-password prompt that
#                      System Settings -> Privacy & Security -> "Open Anyway"
#                      asks for. Only ever visible on a DOWNLOADED build: a
#                      locally built .app carries no com.apple.quarantine, so
#                      the requirement is never evaluated and the bug hides.
#                      Real through desktop-v0.0.7; the three App Store Connect
#                      API secrets landed on 2026-08-28.
name: macOS signing check

# MANUAL ONLY, and the push trigger is not coming back without a reason.
#
# It used to fire on any push touching the paths below. That cost a full
# macos-14 job -- billed at 10x the Linux rate -- for every such push, and once
# notarization was switched on each of those jobs ran the full 60 minutes and
# was killed by the timeout, because notarytool never returns on a hosted
# runner (2026-08-28: two consecutive runs, 33143417933 and 33147522451, both
# silent for ~54 minutes on a 16MB bundle while Apple reported no incident and
# had already ACCEPTED an earlier submission). Two runs, two hours of macOS
# runner time, to learn one fact twice.
#
# Each run also costs an App Store Connect submission, and cancel-in-progress
# killed notarytool mid-upload -- leaving submissions wedged at `In Progress`
# on the team forever. Apple throttles per team, so an automatic trigger here
# actively degrades the thing it is trying to test.
on:
  workflow_dispatch:
    inputs:
      notarize:
        description: >-
          Also notarize. OFF by default: notarytool does not return on GitHub's
          macOS runners, so this currently guarantees a 60-minute timeout. Turn
          it on only to re-test that, and watch the run.
        type: boolean
        default: false

# A signing check that raced itself would fight over nothing useful; the newest
# push is the only one whose answer anyone wants.
concurrency:
  group: macos-signing-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Ten seconds that answer "did the secrets land", so nobody waits out a
  # 30-minute build to discover a typo in a secret NAME. Runs on Linux and
  # touches no certificate.
  # ---------------------------------------------------------------------------
  preflight:
    name: Which Apple secrets are set
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      signing: ${{ steps.check.outputs.signing }}
      notarization: ${{ steps.check.outputs.notarization }}
    env:
      # Booleans, never the values. An absent secret still DEFINES its variable
      # as the empty string, so `!= ''` is the only honest test -- and comparing
      # here rather than in the step keeps the certificate itself out of every
      # later expression.
      HAS_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
      HAS_CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD != '' }}
      HAS_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY != '' }}
      HAS_KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD != '' }}
      HAS_API_KEY: ${{ secrets.APPLE_API_KEY != '' }}
      HAS_API_ISSUER: ${{ secrets.APPLE_API_ISSUER != '' }}
      HAS_API_P8: ${{ secrets.APPLE_API_KEY_P8_BASE64 != '' }}
      # Secrets being present is necessary but no longer sufficient: asking for
      # notarization is now a deliberate act, for the reasons at the top.
      WANT_NOTARIZE: ${{ inputs.notarize }}
    steps:
      - id: check
        shell: bash
        run: |
          mark() { [ "$1" = 'true' ] && echo '- [x]' || echo '- [ ]'; }

          signing=false
          if [ "$HAS_CERT" = 'true' ] && [ "$HAS_CERT_PASSWORD" = 'true' ] \
             && [ "$HAS_IDENTITY" = 'true' ] && [ "$HAS_KEYCHAIN_PASSWORD" = 'true' ]; then
            signing=true
          fi
          echo "signing=$signing" >> "$GITHUB_OUTPUT"

          # All THREE, not any: the bundler needs the key id, the issuer and the
          # .p8 on disk together, and with any one missing it prints a `Warn
          # skipping app notarization` line and exits 0. That warning scrolls
          # past in a 6-minute log, which is precisely how v0.0.7 shipped
          # unnotarized -- so the decision is made here, once, and turned into
          # the assertion below rather than left to a reader.
          have_api=false
          if [ "$HAS_API_KEY" = 'true' ] && [ "$HAS_API_ISSUER" = 'true' ] \
             && [ "$HAS_API_P8" = 'true' ]; then
            have_api=true
          fi

          notarization=false
          if [ "$have_api" = 'true' ] && [ "$WANT_NOTARIZE" = 'true' ]; then
            notarization=true
          fi
          echo "notarization=$notarization" >> "$GITHUB_OUTPUT"

          # One grouped redirect rather than a dozen appends -- the summary is
          # one document, and writing it as one keeps the pieces in step.
          {
            echo '## Apple secrets on this repository'
            echo
            echo '### Signing - stops the keychain password prompts'
            echo "$(mark "$HAS_CERT") APPLE_CERTIFICATE"
            echo "$(mark "$HAS_CERT_PASSWORD") APPLE_CERTIFICATE_PASSWORD"
            echo "$(mark "$HAS_IDENTITY") APPLE_SIGNING_IDENTITY"
            echo "$(mark "$HAS_KEYCHAIN_PASSWORD") KEYCHAIN_PASSWORD"
            echo
            echo '### Notarization - stops Gatekeeper refusing a DOWNLOADED build'
            echo "$(mark "$HAS_API_KEY") APPLE_API_KEY"
            echo "$(mark "$HAS_API_ISSUER") APPLE_API_ISSUER"
            echo "$(mark "$HAS_API_P8") APPLE_API_KEY_P8_BASE64"
            echo

            if [ "$signing" = 'true' ]; then
              echo 'All four signing secrets are present, so the build below must produce a Developer ID signed bundle or fail.'
            elif [ "$HAS_CERT" = 'true' ]; then
              echo '> **Partial set.** APPLE_CERTIFICATE is present without all of its companions. Signing turns on by the presence of the certificate, so this FAILS the build rather than skipping signing. Set all four or none.'
            else
              echo 'No signing secrets. The build below will be UNSIGNED, and reports that rather than failing.'
            fi
            echo

            if [ "$notarization" = 'true' ]; then
              echo 'Notarization was REQUESTED and all three secrets are present, so the build below must produce a bundle Gatekeeper ACCEPTS or fail.'
              echo
              echo '> Expect this to time out. notarytool has not returned on a hosted runner since 2026-08-28; the bundle is signed either way.'
            elif [ "$have_api" = 'true' ]; then
              echo 'All three notarization secrets are present but notarization was not requested, so the build below is signed only and checked as such. Re-run with `notarize` ticked to exercise it.'
            elif [ "$HAS_API_KEY" = 'true' ] || [ "$HAS_API_ISSUER" = 'true' ] || [ "$HAS_API_P8" = 'true' ]; then
              echo '> **Partial set.** Notarization needs all three together. With any one missing the bundler prints `skipping app notarization` and SUCCEEDS, so the build below is checked as un-notarized and a downloaded copy would still be refused by Gatekeeper. Set all three or none.'
            else
              echo 'No notarization secrets. The build below will be signed but NOT notarized, and reports that rather than failing - a downloaded copy would be refused by Gatekeeper.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # Also as an annotation, because a summary is only read by someone who
          # already went looking. This is the half-state that fails a release.
          if [ "$signing" != 'true' ] && [ "$HAS_CERT" = 'true' ]; then
            echo '::warning::APPLE_CERTIFICATE is set but at least one companion secret is not. Signing turns on by the presence of the certificate, so a partial set FAILS the build rather than skipping signing. Set all four or none.'
          fi

          # The quieter half-state, and the more dangerous one: this does not
          # fail anything. It produces a green run over a bundle that no user
          # can open.
          if [ "$notarization" != 'true' ] \
             && { [ "$HAS_API_KEY" = 'true' ] || [ "$HAS_API_ISSUER" = 'true' ] || [ "$HAS_API_P8" = 'true' ]; }; then
            echo '::warning::Some but not all of APPLE_API_KEY / APPLE_API_ISSUER / APPLE_API_KEY_P8_BASE64 are set. Notarization needs all three, and silently SKIPS when any is missing. Set all three or none.'
          fi

  # ---------------------------------------------------------------------------
  # One architecture of the product app. aarch64 only, and not `universal`,
  # because this answers a question about the SIGNATURE -- which is identical on
  # both halves -- and halving the build is what makes this usable as a check
  # rather than another thing nobody runs.
  # ---------------------------------------------------------------------------
  build:
    name: Build and verify the signature
    needs: preflight
    runs-on: macos-14
    timeout-minutes: 60
    env:
      APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      # See release-desktop.yml: a BOOLEAN, never the certificate. Naming the
      # real variable at job level would hand every step an empty certificate
      # and turn the unsigned build into a failing one.
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Not sparse: hermes-universal pins `[patch.crates-io] tao` at a path
          # inside src-tauri/vendor/, which has to be present to build at all.
          fetch-depth: 1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm

      - name: grab npm 12
        run: npm i -g npm@12

      - uses: ./.github/actions/retry
        with:
          command: npm ci

      - name: Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add aarch64-apple-darwin

      - uses: Swatinem/rust-cache@bc2d2e71bd35c5549942babaa51a89c586b981d1 # v2.8.1
        with:
          workspaces: apps/hermes-universal/src-tauri
          key: aarch64-apple-darwin

      # The credential store is the reason this workflow exists, so its tests
      # run here too -- they are seconds against a 30-minute build, and a
      # migration bug would otherwise only surface as a user signed out.
      - name: Credential store tests
        run: |
          cargo test --manifest-path apps/hermes-universal/src-tauri/Cargo.toml \
            --all-features secrets::

      # Gated on the preflight decision, not merely on the secret existing:
      # writing this path is what makes Tauri attempt notarization at all, so
      # a signing-only run must not create it.
      - name: Materialize App Store Connect API key
        if: needs.preflight.outputs.notarization == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          key_path="$RUNNER_TEMP/asc/AuthKey_${APPLE_API_KEY}.p8"
          echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$key_path"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      # Written to $GITHUB_ENV rather than a step `env:` block for the reason
      # spelled out at length in release-desktop.yml: a YAML mapping cannot omit
      # a key, an absent secret still defines an empty variable, and the Tauri
      # CLI turns signing on when APPLE_CERTIFICATE merely EXISTS. $GITHUB_ENV
      # defines only what is written to it, so with no certificate these names
      # never exist and Tauri skips signing instead of failing.
      - name: Apple signing environment (optional)
        if: env.HAS_APPLE_CERT == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD \
                      APPLE_SIGNING_IDENTITY KEYCHAIN_PASSWORD; do
            value="${!name}"
            [ -n "$value" ] || continue
            {
              echo "${name}<<__ALLR_EOF__"
              echo "$value"
              echo "__ALLR_EOF__"
            } >> "$GITHUB_ENV"
          done

          # The issuer moved OUT of the loop above and behind the same guard as
          # the key id. Tauri notarizes when the API trio is complete, so
          # exporting the issuer on a signing-only run would leave a partial
          # trio -- which is not harmless: it is the exact half-state that makes
          # the bundler print `skipping app notarization` and carry on, the
          # thing preflight warns about. Both names appear together or neither.
          if [ -n "${APPLE_API_KEY_PATH:-}" ]; then
            echo "APPLE_API_KEY=$APPLE_API_KEY" >> "$GITHUB_ENV"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER" >> "$GITHUB_ENV"
          fi

      # No releaseId and no tagName, which is what keeps this a build rather
      # than a release.
      #
      # The two `args` additions do different jobs, and the difference is what
      # broke this workflow on every run from 2026-08-23 to 2026-08-28:
      #
      #   --bundles app   halves the build. An .app is all you need to inspect a
      #                   signature, and release-desktop.yml still covers the
      #                   dmg. An optimization, nothing more.
      #
      #   --config ...    suppresses the updater tarball, and is load-bearing.
      #                   `createUpdaterArtifacts` is a CONFIG setting, not a
      #                   bundle target, so --bundles does not gate it: the
      #                   bundler emitted `Allr.app.tar.gz (updater)` even under
      #                   `--bundles app`, then died on `A public key has been
      #                   found, but no private key`. A config override is the
      #                   only thing that turns it off.
      #
      # Overriding the config rather than plumbing TAURI_SIGNING_PRIVATE_KEY in
      # is deliberate: a dependabot push or a fork PR receives NO repository
      # secrets, so the key would arrive empty and the build would die anyway,
      # ten minutes into compiling -- breaking the same "a branch without
      # secrets must still build" contract that --warn-if-unsigned exists to
      # keep. Nothing here needs a signed updater artifact.
      #
      # Notarization is NOT lost by this. The bundler notarizes the .app while
      # bundling it -- the `skipping app notarization` warning in the 2026-08-28
      # log is printed several steps BEFORE the updater tarball this suppresses.
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        with:
          projectPath: apps/hermes-universal
          args: >-
            --target aarch64-apple-darwin --bundles app --verbose
            --config {"bundle":{"createUpdaterArtifacts":false}}

      # The whole point. Same script release-desktop.yml calls, so this cannot
      # pass while a release fails.
      - name: Verify the signature
        shell: bash
        run: |
          bundle_dir=apps/hermes-universal/src-tauri/target/aarch64-apple-darwin/release/bundle/macos
          bundle="$(find "$bundle_dir" -maxdepth 1 -name '*.app' -print -quit 2>/dev/null || true)"

          if [ -z "$bundle" ]; then
            echo "::error::no .app under $bundle_dir - the build produced no bundle"
            exit 1
          fi

          if [ "${{ needs.preflight.outputs.signing }}" = 'true' ]; then
            mode=--require-signed
          else
            mode=--warn-if-unsigned
          fi

          # Only demand Gatekeeper's approval when notarization was configured.
          # A signed-but-unnotarized bundle is ALWAYS rejected by spctl, and
          # treating that as a signing failure is the bug this shared script was
          # extracted to remove.
          #
          # Gated on preflight's all-three answer rather than on
          # APPLE_API_KEY_PATH, which is what release-desktop.yml still tests.
          # The path is written by the materialize step, which needs only the
          # .p8 -- so with the issuer missing the path exists, the bundler
          # skips notarization with a warning, and a path-gated check would
          # pass a bundle no user can open. Asserting on the same three secrets
          # that decide the bundler's behaviour closes that hole.
          notarized=""
          if [ "${{ needs.preflight.outputs.notarization }}" = 'true' ]; then
            notarized=--expect-notarized
          fi

          ./scripts/verify-macos-signing.sh $mode $notarized "$bundle" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # Tarred, not uploaded raw: actions/upload-artifact walks the tree and
      # drops symlinks and the executable bit, which invalidates the signature —
      # so a downloaded .app would fail the very check it was kept to allow.
      - name: Package the bundle
        if: always()
        shell: bash
        run: |
          bundle_dir=apps/hermes-universal/src-tauri/target/aarch64-apple-darwin/release/bundle/macos
          bundle="$(find "$bundle_dir" -maxdepth 1 -name '*.app' -print -quit 2>/dev/null || true)"
          [ -n "$bundle" ] || exit 0
          tar -C "$bundle_dir" -czf "$RUNNER_TEMP/Allr-aarch64-signed.tar.gz" "$(basename "$bundle")"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: Allr-aarch64-signed
          path: ${{ runner.temp }}/Allr-aarch64-signed.tar.gz
          if-no-files-found: warn
          retention-days: 7
