name: Release Desktop

# Signed, cross-platform desktop releases for Allr (apps/hermes-universal).
#
# ONE app ships from here. `apps/bootstrap-installer` ("Allr Setup") used to
# ride along on the same tag and is deliberately no longer released: it exists
# to drive scripts/install.ps1 through PowerShell, so its Linux and macOS
# bundles had no install script to run and did nothing when launched, and its
# Windows NSIS output (`Allr-Setup_<ver>_x64-setup.exe`) sat one character away
# from the product app's own `Allr_<ver>_x64-setup.exe` on the release page.
# It is still built and tested by js-tests.yml / installer-tests.yml.
#
# TRIGGER: `desktop-v<semver>` tags ONLY, and the prefix is load-bearing.
# `v<semver>` is the Python CLI's CalVer channel (scripts/release.py), and
# install-e2e.yml fires an ~11-minute-per-leg matrix on `v[0-9]+.[0-9]+.[0-9]+`.
# A desktop tag must not look like one.
#
# THE RELEASE IS NEVER "latest". `updates.rs` in shipped builds, install.sh, and
# install-e2e.yml all read /releases/latest and expect the Python CalVer
# release, so the final `gh release edit` passes --latest=false. The desktop
# update channel is addressed by its own fixed `desktop-updater` tag instead
# (see the `publish` job) -- which is also why plugins.updater.endpoints in
# tauri.conf.json points at that tag and NOT at /releases/latest/download/.
# Pointing it at "latest" would resolve to a Python release with no latest.json,
# and the failure would surface to users as a reassuring "You're on the latest
# version" rather than an error.
#
# Everything here is optional-by-presence, the same rule
# gen/android/keystore.properties follows: with no signing secrets the jobs
# still succeed and produce UNSIGNED artifacts. Windows is unsigned today by
# design -- see the "Windows code signing" step.

on:
  push:
    tags:
      - 'desktop-v[0-9]+.[0-9]+.[0-9]+'
      - 'desktop-v[0-9]+.[0-9]+.[0-9]+-*' # -rc.1, -beta.2
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing desktop-v* tag to (re)build.'
        required: true
        type: string

permissions:
  contents: write # create the release and upload assets

concurrency:
  # Never cancel: a half-uploaded release is worse than a slow one.
  group: release-desktop-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # ---------------------------------------------------------------------------
  # A 30-second gate in front of ~40 minutes of compilation. The version lives
  # in eleven places (see scripts/bump-desktop-version.py) and a stale one does
  # not fail loudly -- tauri catches some, the tracked Apple project catches
  # none. Better to find out here than after notarization.
  # ---------------------------------------------------------------------------
  verify-version:
    name: Verify version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.TAG }}

      - id: resolve
        run: |
          version="${TAG#desktop-v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          python3 scripts/bump-desktop-version.py --check "$version"

  # ---------------------------------------------------------------------------
  # One draft release up front, so the six matrix legs upload into the same
  # place and a failed leg never leaves a half-populated public release.
  # ---------------------------------------------------------------------------
  create-draft:
    name: Create draft release
    needs: verify-version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_id: ${{ steps.draft.outputs.release_id }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.TAG }}

      - id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.verify-version.outputs.version }}
        run: |
          # A DRAFT is not reachable through /releases/tags/{tag}: that endpoint
          # matches PUBLISHED releases only, so it 404s however many drafts carry
          # the tag -- which is why this job failed on its first ever run, having
          # just successfully created the draft it then could not find. The list
          # endpoint does include drafts for an authenticated caller, so resolve
          # the id there.
          #
          # `env.TAG` inside the jq filter rather than shell interpolation: the
          # tag would otherwise have to be spliced through two layers of quoting
          # inside a YAML block scalar.
          draft_id() {
            gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
              --jq '.[] | select(.tag_name == env.TAG) | .id' | head -1
          }

          # Idempotent: a re-run of the same tag reuses its draft rather than
          # failing, so a single flaky leg can be retried without starting over.
          # This is also what stops a retry stacking up a second draft for one tag.
          id="$(draft_id)"

          # Create through the API rather than `gh release create`, and take the
          # id straight out of the response.
          #
          # The obvious version -- create, then look the draft up again -- has a
          # race, and desktop-v0.0.6 lost it: the draft was created correctly and
          # the very next list call did not yet include it, so the job failed
          # having just done its job. GET /releases is eventually consistent;
          # POST /releases answers with the release object itself, which cannot
          # be stale because it IS the thing that was written.
          if [ -z "$id" ]; then
            id="$(gh api "repos/${GITHUB_REPOSITORY}/releases" \
              --method POST \
              -f tag_name="$TAG" \
              -F draft=true \
              -f name="Allr Desktop v$VERSION" \
              -f body="Desktop builds of Allr. See the assets below. On Linux, \`curl -fsSL https://raw.githubusercontent.com/allr-ajmx/allr-agent/main/scripts/install-desktop-linux.sh | bash\` installs into ~/.local with no root." \
              --jq '.id')"
          fi

          # Never hand an empty releaseId to the matrix: tauri-action would treat
          # it as "no release" and the six legs would build for 40 minutes and
          # upload nowhere.
          if [ -z "$id" ]; then
            echo "::error::could not resolve a release id for $TAG"
            exit 1
          fi

          echo "release_id=$id" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Three legs, one per platform. `include` rather than a cross product so each
  # row can carry its own runner image and Rust target.
  # ---------------------------------------------------------------------------
  build:
    name: ${{ matrix.label }}
    needs: [verify-version, create-draft]
    strategy:
      fail-fast: false # report all three results, not just the first failure
      matrix:
        include:
          # macOS is built UNIVERSAL, not per-arch, and that is deliberate.
          # Tauri names per-arch DMGs `_x64.dmg`, but `updates.rs` matches an
          # asset by `contains(std::env::consts::ARCH)` -- i.e. "x86_64", which
          # "x64" does not contain. A split build would hand Intel users the
          # aarch64 DMG. One universal artifact makes the ambiguity impossible.
          - { os: macos-14, target: universal-apple-darwin, label: macOS }
          # ubuntu-22.04, NOT ubuntu-latest: ubuntu-latest is 24.04 (glibc 2.39)
          # and glibc is forward- but not backward-compatible, so a binary built
          # there refuses to start on Ubuntu 22.04 / Debian 12 / Mint 21 with
          # `GLIBC_2.38 not found` -- which users experience as "it does nothing
          # when I double-click it". Build on the oldest distro we intend to
          # support.
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, label: Linux }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, label: Windows }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90 # a cold universal macOS build plus notarization
    # Job-level, not step-level: a step's own `env:` block is NOT in scope for
    # that step's `if:`, so an optional-by-presence gate written there would
    # read '' and skip forever -- silently shipping unsigned artifacts.
    env:
      APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      # A BOOLEAN, not the certificate. An absent secret still DEFINES its env
      # var as the empty string, and the Tauri CLI turns signing on when
      # APPLE_CERTIFICATE merely exists rather than when it is non-empty -- so
      # naming the real variable here would hand every step an empty
      # certificate and make the unsigned build the one that fails. It did:
      # `security import cert.p12 -P` with an empty password and an empty file,
      # on the first release run. Tauri reads no variable called this.
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.TAG }}
          # NOT a sparse or filtered checkout: hermes-universal pins
          # `[patch.crates-io] tao` at a path inside src-tauri/vendor/, which is
          # tracked and must be present.
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: npm

      - name: grab npm 12
        run: npm i -g npm@12

      - uses: ./.github/actions/retry
        with:
          command: npm ci

      # rustup is preinstalled on every runner image, so no third-party
      # toolchain action is pulled in -- same reasoning as js-tests.yml.
      - name: Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

          # A universal binary is lipo'd from two real builds, so both halves
          # need their target installed.
          if [ "${{ matrix.target }}" = "universal-apple-darwin" ]; then
            rustup target add x86_64-apple-darwin aarch64-apple-darwin
          fi

      - uses: Swatinem/rust-cache@bc2d2e71bd35c5549942babaa51a89c586b981d1 # v2.8.1
        with:
          workspaces: apps/hermes-universal/src-tauri
          key: ${{ matrix.target }}

      # librsvg2-dev and patchelf were here for the AppImage, which is no longer
      # built (see the tarball step below). They are kept because the icon and
      # binary handling in the deb/rpm bundlers reach for them on some paths and
      # a 30-minute build is a bad place to discover that; drop them only with a
      # green Linux leg to show for it. Keep this list in step with the
      # prerequisites in apps/hermes-universal/README.md.
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            file

      # The App Store Connect API key has to exist as a file on disk. Written
      # under RUNNER_TEMP, which is wiped with the runner, and skipped entirely
      # when the secret is absent so an unsigned build still succeeds.
      - name: Materialize App Store Connect API key
        if: runner.os == 'macOS' && env.APPLE_API_KEY_P8_BASE64 != ''
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          key_path="$RUNNER_TEMP/asc/AuthKey_${APPLE_API_KEY}.p8"
          echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$key_path"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      # Windows ships UNSIGNED today: there is no certificate. This step is the
      # seam that turns it on, and it is optional-by-presence exactly like
      # gen/android/keystore.properties -- with no AZURE_CLIENT_ID secret it is
      # skipped and nothing else in the workflow changes.
      #
      # Azure Trusted Signing rather than a .pfx-in-a-secret: OV/EV certificates
      # now require an FIPS-140-2 hardware token that a hosted runner cannot
      # hold, so a .pfx design would have to be unpicked later. Until this is
      # switched on, SmartScreen will warn on first run -- documented in
      # website/docs/getting-started/installation.md.
      - name: Windows code signing (optional)
        if: runner.os == 'Windows' && env.AZURE_CLIENT_ID != ''
        run: echo "Trusted Signing secrets present - wire trusted-signing-cli here."

      # macOS signing + notarization, exported HERE rather than in the build
      # step's `env:` block, because a YAML `env:` mapping cannot omit a key.
      # Every `${{ secrets.X }}` that names an absent secret still DEFINES X as
      # the empty string, and the Tauri CLI enables signing on the existence of
      # APPLE_CERTIFICATE, not on its contents -- so listing these below turned
      # the no-secrets build into a FAILING one instead of an unsigned one.
      # $GITHUB_ENV defines only what is written to it, so when there is no
      # certificate these names never exist and Tauri skips signing.
      #
      # The heredoc form is required: a certificate is base64 that may wrap, and
      # `KEY=value` in $GITHUB_ENV is single-line only. The delimiter is fixed
      # rather than random because the values are base64/identifiers and cannot
      # contain it. Values stay masked; they came from `secrets`.
      #
      # ALLR-33 tracks turning this on. Today NONE of these secrets are set, so
      # every macOS release ships ad-hoc signed: Gatekeeper blocks the download
      # and the keychain re-prompts on every credential read. The fix is not a
      # change here -- it is populating the secrets from the Mac that holds the
      # certificates, then proving it with macos-signing-check.yml.
      - name: Apple signing environment (optional)
        if: runner.os == 'macOS' && env.HAS_APPLE_CERT == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD \
                      APPLE_SIGNING_IDENTITY KEYCHAIN_PASSWORD APPLE_API_ISSUER; do
            value="${!name}"
            [ -n "$value" ] || continue
            {
              echo "${name}<<__ALLR_EOF__"
              echo "$value"
              echo "__ALLR_EOF__"
            } >> "$GITHUB_ENV"
          done

          # Set by the API-key step above, and only when that secret existed.
          if [ -n "${APPLE_API_KEY_PATH:-}" ]; then
            echo "APPLE_API_KEY=$APPLE_API_KEY" >> "$GITHUB_ENV"
          fi

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          # Updater signing.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/hermes-universal
          releaseId: ${{ needs.create-draft.outputs.release_id }}
          args: --target ${{ matrix.target }} --verbose
          uploadUpdaterJson: true
          retryAttempts: 2

      # -----------------------------------------------------------------------
      # The AppImage's replacement.
      #
      # `bundle.targets` no longer lists `appimage`. An AppImage carries its own
      # copy of WebKitGTK, taken from this runner -- and ubuntu-22.04's
      # WebKitGTK cannot initialise EGL against a modern host graphics stack.
      # The shipped Allr_0.0.7 AppImage opened a window and never painted a
      # pixel, aborting with "Could not create default EGL display:
      # EGL_BAD_PARAMETER"; the identical binary linked against the host's
      # WebKitGTK renders fine. That is unfixable from here without either
      # freezing users to this runner's vintage or unpicking linuxdeploy, so the
      # distro-agnostic download is now a plain tarball: our binary, the host's
      # libraries, an install.sh.
      #
      # Uploaded with `gh` rather than by tauri-action, which only knows about
      # bundler outputs.
      # -----------------------------------------------------------------------
      - name: Package and upload the Linux tarball
        if: runner.os == 'Linux'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tarball="$(./scripts/package-linux-tarball.sh \
            "apps/hermes-universal/src-tauri/target/${{ matrix.target }}/release/hermes-universal" \
            "${{ needs.verify-version.outputs.version }}" \
            "$RUNNER_TEMP/tarball")"

          echo "built $tarball"
          gh release upload "$TAG" "$tarball" --clobber

      # -----------------------------------------------------------------------
      # SMOKE TESTS. The step that would have caught desktop-v0.0.7.
      #
      # Until now nothing in this workflow ever LAUNCHED what it built:
      # tauri-action compiles and uploads in one move, and the only post-build
      # assertions were a signature check and a latest.json key check. A bundle
      # that starts and then fails to render is indistinguishable from a good
      # one under those, which is how three releases went out green while the
      # AppImage put up a window that never painted a pixel.
      #
      # These run BEFORE the publish job flips the draft, and nothing is
      # `continue-on-error`: a bundle we could not launch must not ship.
      # -----------------------------------------------------------------------
      - name: Smoke-test the bundles (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          # Absolute, because the step chdirs to /tmp below and the upload step
          # names this same path.
          SMOKE_SHOT_DIR: /tmp/smoke-shots
        run: |
          # xvfb + xdotool to run and inspect headlessly; imagemagick for the
          # did-it-actually-paint check. See the script for why that check is
          # the load-bearing one.
          sudo apt-get install -y xvfb xdotool imagemagick

          # The tarball is unpacked and launched from ITS OWN contents rather
          # than from the build tree, so what runs here is byte-for-byte the
          # artifact a user downloads.
          mkdir -p "$RUNNER_TEMP/unpack"
          tar -xzf "$RUNNER_TEMP"/tarball/*.tar.gz -C "$RUNNER_TEMP/unpack"
          unpacked="$(find "$RUNNER_TEMP/unpack" -maxdepth 2 -type f -name allr -print -quit)"
          [ -n "$unpacked" ] || { echo "::error::no allr binary in the tarball"; exit 1; }

          cd /tmp
          "$GITHUB_WORKSPACE/scripts/smoke-test-linux-bundle.sh" "$unpacked" tarball

          # And the binary the .deb and .rpm install, which is the same build
          # but reached through the packaged path.
          "$GITHUB_WORKSPACE/scripts/smoke-test-linux-bundle.sh" \
            "$GITHUB_WORKSPACE/apps/hermes-universal/src-tauri/target/${{ matrix.target }}/release/hermes-universal" \
            package-binary

      - name: Smoke-test the bundle (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          bundle_dir="apps/hermes-universal/src-tauri/target/${{ matrix.target }}/release/bundle/macos"
          app="$(find "$bundle_dir" -maxdepth 1 -name '*.app' -print -quit)"
          [ -n "$app" ] || { echo "::error::no .app under $bundle_dir"; exit 1; }

          # `open` and not the inner binary: it goes through LaunchServices, so a
          # bundle Gatekeeper or a broken Info.plist would refuse fails here the
          # same way it fails for a user.
          open "$app"

          for _ in $(seq 1 30); do
            windows="$(osascript -e 'tell application "System Events" to count windows of (first process whose name is "Allr")' 2>/dev/null || echo 0)"
            [ "${windows:-0}" -gt 0 ] && break
            sleep 1
          done

          pkill -x Allr || true

          if [ "${windows:-0}" -le 0 ]; then
            echo "::error::Allr opened no window within 30s of launch"
            exit 1
          fi
          echo "ok - $windows window(s)"

      - name: Smoke-test the bundle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bundle = "apps/hermes-universal/src-tauri/target/${{ matrix.target }}/release"
          $exe = Join-Path $bundle "Allr.exe"
          if (-not (Test-Path $exe)) {
            Write-Output "::error::no Allr.exe under $bundle"
            exit 1
          }

          $proc = Start-Process -FilePath $exe -PassThru
          $handle = 0
          foreach ($_ in 1..30) {
            Start-Sleep -Seconds 1
            $live = Get-Process -Id $proc.Id -ErrorAction SilentlyContinue
            if (-not $live) {
              Write-Output "::error::Allr.exe exited during startup"
              exit 1
            }
            $live.Refresh()
            if ($live.MainWindowHandle -ne 0) { $handle = $live.MainWindowHandle; break }
          }

          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue

          if ($handle -eq 0) {
            Write-Output "::error::Allr.exe opened no window within 30s of launch"
            exit 1
          }
          Write-Output "ok - main window handle $handle"

      # Kept whether the smoke tests passed or failed: on a failure the frame is
      # the whole diagnostic, and a green run's frame is how you confirm the
      # threshold is not about to start failing on a legitimate UI change.
      - name: Keep the smoke-test screenshots
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: smoke-shots-${{ matrix.label }}
          path: /tmp/smoke-shots
          if-no-files-found: warn
          retention-days: 7

      # Every macOS release so far shipped ad-hoc signed, and nothing said so.
      # The signing steps above are optional-by-presence, which is right for a
      # fork with no certificate -- but it also meant a repo that MEANT to sign
      # and had a broken secret produced a silently unsigned build that looked
      # like a success.
      #
      # This is not why users complain about Gatekeeper. It is why they complain
      # that the app asks for their keychain password four or five times on every
      # launch: macOS binds a keychain item's ACL to the requesting code's
      # designated requirement, and an ad-hoc bundle has none, so every credential
      # read and write re-prompts and "Always Allow" cannot stick.
      #
      # `always()` so this still reports on a leg whose upload was retried, and
      # `continue-on-error` is deliberately NOT set: shipping an unsigned bundle
      # under a signed release is the failure.
      - name: Verify the macOS bundle is actually signed
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          bundle_dir="apps/hermes-universal/src-tauri/target/${{ matrix.target }}/release/bundle/macos"
          bundle="$(find "$bundle_dir" -maxdepth 1 -name '*.app' -print -quit 2>/dev/null || true)"

          if [ -z "$bundle" ]; then
            echo "::error::no .app under $bundle_dir - the build did not produce a bundle"
            exit 1
          fi

          # Signing is optional-by-presence, so which contract applies depends on
          # whether a certificate was configured for THIS run. With one, an
          # unsigned bundle means a broken secret and must stop the release; a
          # fork without one must still be able to build.
          if [ "$HAS_APPLE_CERT" = 'true' ]; then
            mode=--require-signed
          else
            mode=--warn-if-unsigned
          fi

          # Only demand Gatekeeper's approval when notarization was actually
          # configured. Signing alone is ALWAYS rejected by spctl, and failing on
          # that would fail every correctly signed build that simply is not
          # notarized -- which is what the hand-written copy of these checks used
          # to do.
          notarized=""
          if [ -n "${APPLE_API_KEY_PATH:-}" ]; then
            notarized=--expect-notarized
          fi

          ./scripts/verify-macos-signing.sh $mode $notarized "$bundle"

  # ---------------------------------------------------------------------------
  # Publish. Order matters: the updater pointer must only be moved once every
  # asset URL it will name actually exists.
  # ---------------------------------------------------------------------------
  publish:
    name: Publish release
    needs: [verify-version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.verify-version.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.TAG }}

      - name: Checksums for every asset
        run: |
          mkdir -p dist && cd dist
          gh release download "$TAG" --clobber

          # Windows is unsigned, so a published checksum is the only integrity
          # signal a careful user has. Excludes the updater signatures (already
          # signatures) and any previous SHA256SUMS. -print0/-d '' rather than
          # word-splitting `ls`, so an asset name with a space can never split.
          find . -maxdepth 1 -type f \
            ! -name '*.sig' ! -name 'SHA256SUMS*' -print0 \
            | sort -z \
            | xargs -0 -r sha256sum > SHA256SUMS.txt

          gh release upload "$TAG" SHA256SUMS.txt --clobber

      - name: Sanity-check the updater manifest
        id: manifest
        run: |
          cd dist

          if [ ! -f latest.json ]; then
            echo "::error::latest.json is missing - the updater legs did not produce one."
            exit 1
          fi

          # A manifest missing a platform silently strands that platform on the
          # old build, reporting "up to date" rather than an error. Fail loudly.
          for platform in darwin-aarch64 darwin-x86_64 windows-x86_64; do
            if ! jq -e --arg p "$platform" '.platforms[$p].url' latest.json >/dev/null; then
              echo "::error::latest.json has no entry for $platform"
              exit 1
            fi
          done

          # Linux is checked by PREFIX, not by exact key. Tauri emits a bare
          # `linux-x86_64` alongside per-format `linux-x86_64-deb` /
          # `-rpm` / `-appimage` variants, and which of those exists depends on
          # the bundle targets -- the bare key used to be the AppImage's, and
          # the AppImage is no longer built. Demanding one literal name here
          # would fail the release over a rename rather than over a platform
          # actually being stranded.
          if ! jq -e '[.platforms | keys[] | select(startswith("linux-x86_64"))] | length > 0' \
               latest.json >/dev/null; then
            echo "::error::latest.json has no linux-x86_64* entry"
            jq -r '.platforms | keys[]' latest.json | sed 's/^/  found: /'
            exit 1
          fi

          jq -e --arg v "$VERSION" '.version == $v' latest.json >/dev/null \
            || { echo "::error::latest.json version != $VERSION"; exit 1; }

          echo "latest.json covers macOS, Linux and Windows at $VERSION"

      - name: Publish
        run: |
          # --latest=false is load-bearing: /releases/latest must keep resolving
          # to the Python CalVer release that install.sh and install-e2e.yml are
          # built around.
          if [[ "$VERSION" == *-* ]]; then
            gh release edit "$TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$TAG" --draft=false --latest=false
          fi

      # LAST, and deliberately so. latest.json names asset URLs on the
      # desktop-v* release, and a DRAFT release's asset URLs 404 -- moving
      # the pointer before publishing would advertise a version nobody can
      # download. A prerelease never moves the stable pointer at all.
      - name: Move the updater pointer
        if: ${{ !contains(needs.verify-version.outputs.version, '-') }}
        run: |
          # A permanent, fixed-tag prerelease whose ONLY asset is latest.json.
          # Prerelease so it can never become /releases/latest and displace the
          # Python CalVer channel that install.sh depends on. This fixed URL is
          # what plugins.updater.endpoints names; do not "simplify" it to
          # /releases/latest/download/.
          if ! gh release view desktop-updater >/dev/null 2>&1; then
            gh release create desktop-updater \
              --prerelease \
              --title "Desktop update channel" \
              --notes "Pointer release. Its only asset is latest.json, which the Allr desktop updater reads. Not a downloadable build - see the desktop-v* releases."
          fi

          gh release upload desktop-updater dist/latest.json --clobber
